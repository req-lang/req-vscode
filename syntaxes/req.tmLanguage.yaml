$schema: "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json"

name: req
scopeName: source.req

variables:
  label: "[_[:alpha:]][_[:alnum:]]*"

patterns:
  - include: "#entities"

repository:
  entities:
    patterns:
      - include: "#informal"
      - include: "#tag"
      - include: "#import"
      - include: "#package"
      - include: "#part"
      - include: "#requirement"
      - include: "#type"
      - include: "#attribute"

  package:
    begin: \b(package)\s+({{label}})
    end: \b(package)\s*$
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: entity.name.namespace.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - include: "#entities"

  part:
    begin: \b(part)\s+({{label}})
    end: \b(part)\s*$
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: entity.name.type.class.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - include: "#entities"

  requirement:
    begin: \b(requirement)\s+({{label}})
    end: \b(requirement)\s*$
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: entity.name.function.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - match: \b(on|via|refines|specializes|derives|top|bottom)\b
        name: storage.modifier.req

      - match: \b(is)\b
        name: keyword.other.req

      - include: "#informal"
      - include: "#expression"

  type:
    begin: \b(type)\s+({{label}})\s+(has)\b
    end: \b(type)\s*$
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: entity.name.type.enum.req
      3:
        name: keyword.other.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - match: (\|)
        name: punctuation.separator.req

      - match: ({{label}})
        name: variable.other.enummember.req

  attribute:
    begin: \b(let)\s+({{label}})\s+(in)\b
    end: $
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: variable.other.property.req
      3:
        name: keyword.other.req
    patterns:
      - include: "#unit"
      - include: "#expression"

  import:
    begin: \b(import)\b
    end: $
    beginCaptures:
      1:
        name: keyword.control.import.req
    patterns:
      - include: "#path"

  unit:
    begin: (\\)
    end: (\\)
    beginCaptures:
      1:
        name: punctuation.definition.unit.req
    endCaptures:
      1:
        name: punctuation.definition.unit.req
    name: constant.other.unit.req

  tag:
    begin: (#)
    end: (#)
    beginCaptures:
      1:
        name: punctuation.definition.comment.req
    endCaptures:
      1:
        name: punctuation.definition.comment.req
    name: comment.line.req

  informal:
    begin: (@@)
    end: (@@)

    beginCaptures:
      1:
        name: punctuation.definition.comment.req
    endCaptures:
      1:
        name: punctuation.definition.comment.req

    name: comment.block.req
    patterns:
      - include: "#reference"

  reference:
    begin: (\{)
    end: (\})

    beginCaptures:
      1:
        name: punctuation.separator.req

    endCaptures:
      1:
        name: punctuation.separator.req

    patterns:
      - include: "#path"

  path:
    patterns:
      - match: (::)
        captures:
          1:
            name: keyword.operator.namespace.req
      - match: ({{label}})
        captures:
          1:
            name: variable.name.req

  expression:
    patterns:
      - include: "#literal"
      - include: "#when"
      - include: "#aggregation"
      - include: "#binding"
      - include: "#logical"
      - include: "#temporal"
      - include: "#set"
      - include: "#comparison"
      - include: "#arithmetic"
      - include: "#brackets"
      - include: "#set_constructor"
      - include: "#call"
      - include: "#group"
      - include: "#path"
      - match: (,)
        name: punctuation.separator.comma.req

  when:
    begin: \b(when)\b
    end: \b(end)\b
    beginCaptures:
      1:
        name: keyword.control.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - match: \b(then|otherwise)\b
        name: keyword.control.req

      - include: "#expression"

  aggregation:
    begin: \b(all|any|one|max|min|sum|prod|argmax|argmin|sup|inf|count|choose)\b
    end: \b(end)\b
    beginCaptures:
      1:
        name: keyword.control.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - include: "#expression"

  binding:
    patterns:
      - match: \b(for|such|that)\b
        name: keyword.control.req

  logical:
    patterns:
      - match: \b(and|or|not|xor|implies|iff)\b
        name: keyword.operator.logical.req

  temporal:
    patterns:
      - match: \b(always|eventually|rising|falling|previously|since)\b
        name: keyword.operator.temporal.req keyword.control.req

  set:
    patterns:
      - match: \b(union|intersection|difference|complement|includes|in)\b
        name: keyword.operator.set.req keyword.control.req

  comparison:
    patterns:
      - match: (:=|°=)
        name: keyword.operator.assignment.req

      - match: \b(tol)\b
        name: keyword.operator.tolerance.req

      - match: (>=|<=|<>|=|<|>)
        name: keyword.operator.comparison.req

  arithmetic:
    patterns:
      - match: (\+|-|\*|\/|%|\^|!)
        name: keyword.operator.arithmetic.req

  brackets:
    patterns:
      - match: (\[\[|\]\])
        name: punctuation.definition.range.req

      - match: (\[|\])
        name: punctuation.definition.interval.req

  set_constructor:
    begin: (\{)
    end: (\})
    beginCaptures:
      1:
        name: punctuation.definition.set.req
    endCaptures:
      1:
        name: punctuation.definition.set.req
    patterns:
      - include: "#expression"

  call:
    begin: \b({{label}})\s*\(
    end: \)
    beginCaptures:
      1:
        name: entity.name.function.call.req
    patterns:
      - include: "#expression"

  group:
    begin: (\()
    end: (\))
    beginCaptures:
      1:
        name: punctuation.section.group.req
    endCaptures:
      1:
        name: punctuation.section.group.req
    patterns:
      - include: "#expression"

  literal:
    patterns:
      - match: \b(true|false|undefined|infinity)\b
        name: constant.language.req

      - match: \b(real|integer|boolean)\b
        name: support.type.req

      - match: \b\d+(\.\d*)?([eE]\d+)?
        name: constant.numeric.req
