$schema: "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json"

name: req
scopeName: source.req

variables:
  label: "[_[:alpha:]][_[:alnum:]]*"

patterns:
  - include: "#informal"
  - include: "#package"
  - include: "#tag"

repository:
  part:
    begin: \b(part)\s+({{label}})
    end: \b(part)\n
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: entity.name.section.req
    endCaptures:
      1:
        name: keyword.other.req

    patterns:
      - include: "#informal"
      - include: "#part"
      - include: "#attribute"
      - include: "#tag"

  attribute:
    match: \b(let)\s+({{label}})\s+(in|is)\s+({{label}})(\s+(\[.*\]))?
    captures:
      1:
        name: keyword.other.req
      2:
        name: entity.name.req
      3:
        name: keyword.other.req
      4:
        name: entity.name.type.req
      5:
        name: entity.name.type.req
      6:
        name: constant.language.req

  package:
    begin: \b(package)\s+({{label}})
    end: \b(package)\n
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: entity.name.section.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - include: "#informal"
      - include: "#part"
      - include: "#requirement"
      - include: "#package"
      - include: "#tag"

  requirement:
    begin: \b(requirement)\s+({{label}})
    end: \b(requirement)\n
    beginCaptures:
      1:
        name: storage.type.req
      2:
        name: entity.name.function.req

    endCaptures:
      1:
        name: keyword.other.req

    patterns:
      - match: (refines|derives|specializes)
        captures:
          1:
            name: storage.modifier.req

      - match: (is)
        name: keyword.other.req

      - include: "#constraint"
      - include: "#informal"
      - include: "#identifier"

  tag:
    begin: (#)
    end: (#)
    beginCaptures:
      1:
        name: punctuation.definition.comment.req
    endCaptures:
      1:
        name: punctuation.definition.comment.req
    name: comment.line.req

  informal:
    begin: (@@)
    end: (@@)

    beginCaptures:
      1:
        name: punctuation.definition.comment.req
    endCaptures:
      1:
        name: punctuation.definition.comment.req

    name: comment.block.req
    patterns:
      - include: "#reference"

  reference:
    begin: (\{)
    end: (\})

    beginCaptures:
      1:
        name: punctuation.separator.req

    endCaptures:
      1:
        name: punctuation.separator.req

    patterns:
      - match: (::)
        captures:
          1:
            name: keyword.operator.namespace.req
      - match: ({{label}})
        captures:
          1:
            name: variable.name.req

  constraint:
    patterns:
      - include: "#if"
      - include: "#when"
      - include: "#predicate"
      - include: "#aggregation"
      - include: "#expression"
      - include: "#set_constructor"
      - match: \b(\,)
        name: punctuation.semi.req

  if:
    begin: \b(if)
    end: \b(end)
    beginCaptures:
      1:
        name: keyword.control.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - match: \b(then)
        name: keyword.control.req

      - match: \b(else)
        name: keyword.control.req

      - include: "#constraint"

  when:
    begin: \b(when)
    end: \b(end)
    beginCaptures:
      1:
        name: keyword.control.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - match: then
        name: keyword.control.req

      - match: \b(otherwise)
        name: keyword.control.req

      - include: "#constraint"

  predicate:
    begin: \b(exists|forall|select)
    end: \b(end)
    beginCaptures:
      1:
        name: keyword.control.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - match: (in)
        name: keyword.operator.new.req

      - match: (such|that)
        name: keyword.control.req

      - match: maximize|minimize
        name: keyword.control.req

      - include: "#constraint"

  aggregation:
    begin: \b(all|any)
    end: \b(end)
    beginCaptures:
      1:
        name: keyword.control.req
    endCaptures:
      1:
        name: keyword.other.req
    patterns:
      - include: "#constraint"

  expression:
    patterns:
      - include: "#literal"
      - include: "#logical"
      - include: "#temporal"
      - include: "#arithmetic"
      - include: "#comparison"
      - include: "#set"
      - include: "#call"
      - include: "#identifier"

  logical:
    patterns:
      - match: \b(and|or|not|xor|implies|iff)\b
        name: keyword.operator.logical.req

  temporal:
    patterns:
      - match: \b(always|eventually|rising|falling|previously|since)\b
        name: keyword.operator.temporal.req keyword.control.req

  arithmetic:
    patterns:
      - match: (\+|-|\*|\/|%|\^|!)
        name: keyword.operator.arithmetic.req

  comparison:
    patterns:
      - match: (=|/=|<|<=|>|>=)
        name: keyword.operator.comparison.req

  set:
    patterns:
      - match: \b(union|intersection|difference|includes|subset|in)\b
        name: keyword.operator.set.sdl keyword.control.req

  call:
    patterns:
      - begin: \b({{label}})\s*\(
        end: \)
        beginCaptures:
          1:
            name: entity.name.package.req
        patterns:
          - include: "#expression"

  identifier:
    begin: ({{label}})
    end: ({{label}})?

    beginCaptures:
      1:
        name: variable.name.req
    endCaptures:
      1:
        name: variable.name.req

    patterns:
      - match: (::)
        captures:
          1:
            name: keyword.operator.namespace.req
      - match: ({{label}})
        captures:
          1:
            name: variable.name.req

  set_constructor:
    begin: ({)
    end: (})
    patterns:
      - include: "#constraint"

  literal:
    patterns:
      - match: \b(true|false|undefined|inf|nan|real|integer|boolean)
        name: constant.language.req

      - match: \b(\d+(\.\d+)?(e[+-]?\d+)?)
        name: constant.numeric.req

      - match: \b(\".*\")
        name: string.quoted.double.req

      - match: \b('.*')
        name: string.quoted.single.req
